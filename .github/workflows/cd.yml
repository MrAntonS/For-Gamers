name: CD

on:
  push:
    branches: [ dev ]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      ref:
        description: Git ref (branch/tag/SHA) to deploy
        required: true
        default: dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Validate required secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ORACLE_VM_IP: ${{ secrets.ORACLE_VM_IP }}
          ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          EBAY_API_KEY: ${{ secrets.EBAY_API_KEY }}
        run: |
          set -euo pipefail
          for v in SSH_PRIVATE_KEY ORACLE_VM_IP ORACLE_VM_USER DB_PASSWORD SECRET_KEY STEAM_API_KEY EBAY_API_KEY; do
            if [ -z "${!v}" ]; then
              echo "Missing required secret: $v" >&2
              exit 1
            fi
          done

      - name: Build frontend image
        run: docker build -t gamer-nexus-frontend:latest ./frontend

      - name: Build backend image
        run: docker build -t gamer-nexus-backend:latest ./backend

      - name: Save Docker images to .tar files
        run: |
          docker save -o frontend.tar gamer-nexus-frontend:latest
          docker save -o backend.tar gamer-nexus-backend:latest

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.ORACLE_VM_IP }} >> ~/.ssh/known_hosts

      - name: Copy files to VM
        run: scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa docker-compose.yml docker-compose.prod.yml frontend.tar backend.tar ${{ secrets.ORACLE_VM_USER }}@${{ secrets.ORACLE_VM_IP }}:~/

      - name: Deploy on VM
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          EBAY_API_KEY: ${{ secrets.EBAY_API_KEY }}
          DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
        run: |
          set -euo pipefail

          SECRET_KEY_B64="$(printf '%s' "$SECRET_KEY" | base64 -w0)"
          POSTGRES_PASSWORD_B64="$(printf '%s' "$DB_PASSWORD" | base64 -w0)"
          STEAM_API_KEY_B64="$(printf '%s' "$STEAM_API_KEY" | base64 -w0)"
          EBAY_API_KEY_B64="$(printf '%s' "$EBAY_API_KEY" | base64 -w0)"

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            ${{ secrets.ORACLE_VM_USER }}@${{ secrets.ORACLE_VM_IP }} \
            "DEPLOY_ENV='$DEPLOY_ENV' SECRET_KEY_B64='$SECRET_KEY_B64' POSTGRES_PASSWORD_B64='$POSTGRES_PASSWORD_B64' STEAM_API_KEY_B64='$STEAM_API_KEY_B64' EBAY_API_KEY_B64='$EBAY_API_KEY_B64' bash -s" << 'EOF'
            set -euo pipefail

            decode() { printf '%s' "$1" | base64 -d; }

            DEPLOY_ENV="${DEPLOY_ENV:-dev}"
            COMPOSE_FILE="docker-compose.yml"
            if [ "$DEPLOY_ENV" = "prod" ]; then
              COMPOSE_FILE="docker-compose.prod.yml"
            fi

            echo "Deploy environment: $DEPLOY_ENV"
            echo "Using compose file: $COMPOSE_FILE"

            cd ~
            test -f "$COMPOSE_FILE" || { echo "Missing compose file: $COMPOSE_FILE" >&2; exit 1; }

            # Create/refresh a local env file for docker compose.
            umask 077
            {
              printf 'SECRET_KEY=%s\n' "$(decode "$SECRET_KEY_B64")"
              printf 'POSTGRES_PASSWORD=%s\n' "$(decode "$POSTGRES_PASSWORD_B64")"
              printf 'STEAM_API_KEY=%s\n' "$(decode "$STEAM_API_KEY_B64")"
              printf 'EBAY_API_KEY=%s\n' "$(decode "$EBAY_API_KEY_B64")"
            } > .env

            # Load images from tarballs
            docker load < frontend.tar
            docker load < backend.tar
            rm -f frontend.tar backend.tar

            echo "Starting services..."
            docker compose --env-file .env -f "$COMPOSE_FILE" up -d --force-recreate --remove-orphans

            echo "Compose status:"
            docker compose --env-file .env -f "$COMPOSE_FILE" ps

            # Wait for db to be accepting connections and authenticated
            echo "Waiting for db readiness..."
            POSTGRES_PASSWORD="$(decode "$POSTGRES_PASSWORD_B64")"
            for i in $(seq 1 30); do
              # Check connectivity AND authentication using psql
              if docker compose --env-file .env -f "$COMPOSE_FILE" exec -T \
                  -e PGPASSWORD="$POSTGRES_PASSWORD" \
                  db psql -U postgres -d gamernexus -c "SELECT 1" >/dev/null 2>&1; then
                echo "db is ready and authenticated"
                break
              fi
              
              if [ "$i" -eq 30 ]; then
                echo "CRITICAL: db did not become ready or authentication failed" >&2
                docker compose --env-file .env -f "$COMPOSE_FILE" logs --tail=200 db || true
                exit 1
              fi
              sleep 2
            done
            echo "DB check passed."

            echo "Verifying services are running..."
            RUNNING_SERVICES="$(docker compose --env-file .env -f "$COMPOSE_FILE" ps --services --filter status=running || true)"
            for svc in backend frontend db; do
              if ! printf '%s\n' "$RUNNING_SERVICES" | grep -qx "$svc"; then
                echo "CRITICAL: $svc is not running" >&2
                docker compose --env-file .env -f "$COMPOSE_FILE" ps -a || true
                docker compose --env-file .env -f "$COMPOSE_FILE" logs --tail=200 "$svc" || true
                exit 1
              fi
            done

            echo "HTTP checks (from inside backend container)..."
            docker compose --env-file .env -f "$COMPOSE_FILE" exec -T backend python - << 'PY'
            import sys
            import urllib.request


            def check(url: str) -> None:
                req = urllib.request.Request(url, headers={"User-Agent": "healthcheck"})
                try:
                    with urllib.request.urlopen(req, timeout=10) as resp:
                        code = getattr(resp, "status", resp.getcode())
                        if code < 200 or code >= 400:
                            raise RuntimeError(f"HTTP {code}")
                except Exception as e:
                    raise RuntimeError(f"Healthcheck failed for {url}: {e}")


            check("http://localhost:5000/api/minmax/games")
            check("http://frontend/")
            print("HTTP checks OK")
            PY

            echo "Waiting 30s for container stabilization..."
            sleep 30

            echo "Verifying services are still healthy..."
            STABLE_SERVICES="$(docker compose --env-file .env -f "$COMPOSE_FILE" ps --services --filter status=running || true)"
            for svc in backend frontend db; do
              if ! printf '%s\n' "$STABLE_SERVICES" | grep -qx "$svc"; then
                echo "CRITICAL: $svc crashed after startup" >&2
                docker compose --env-file .env -f "$COMPOSE_FILE" logs --tail=100 "$svc" || true
                exit 1
              fi
            done

            echo "Deployment successful."
          EOF
