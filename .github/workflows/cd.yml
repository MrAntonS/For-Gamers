name: CD

on:
  push:
    branches: [ dev ]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      ref:
        description: Git ref (branch/tag/SHA) to deploy
        required: true
        default: dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Validate required secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ORACLE_VM_IP: ${{ secrets.ORACLE_VM_IP }}
          ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_API_ENV: ${{ secrets.EBAY_API_ENV }}
        run: |
          set -euo pipefail
          for v in SSH_PRIVATE_KEY ORACLE_VM_IP ORACLE_VM_USER DB_PASSWORD SECRET_KEY STEAM_API_KEY EBAY_CLIENT_ID EBAY_CLIENT_SECRET EBAY_API_ENV; do
            if [ -z "${!v}" ]; then
              echo "Missing required secret: $v" >&2
              exit 1
            fi
          done

      - name: Build frontend image
        run: docker build -t gamer-nexus-frontend:latest ./frontend

      - name: Build backend image
        run: docker build -t gamer-nexus-backend:latest ./backend

      - name: Save Docker images to .tar files
        run: |
          docker save -o frontend.tar gamer-nexus-frontend:latest
          docker save -o backend.tar gamer-nexus-backend:latest

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.ORACLE_VM_IP }} >> ~/.ssh/known_hosts

      - name: Copy files to VM
        run: scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa docker-compose.yml docker-compose.prod.yml frontend.tar backend.tar scripts/healthcheck.sh ${{ secrets.ORACLE_VM_USER }}@${{ secrets.ORACLE_VM_IP }}:~/

      - name: Deploy on VM
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_API_ENV: ${{ secrets.EBAY_API_ENV }}
          DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
        run: |
          set -euo pipefail

          SECRET_KEY_B64="$(printf '%s' "$SECRET_KEY" | base64 -w0)"
          POSTGRES_PASSWORD_B64="$(printf '%s' "$DB_PASSWORD" | base64 -w0)"
          STEAM_API_KEY_B64="$(printf '%s' "$STEAM_API_KEY" | base64 -w0)"
          EBAY_CLIENT_ID_B64="$(printf '%s' "$EBAY_CLIENT_ID" | base64 -w0)"
          EBAY_CLIENT_SECRET_B64="$(printf '%s' "$EBAY_CLIENT_SECRET" | base64 -w0)"
          EBAY_API_ENV_B64="$(printf '%s' "$EBAY_API_ENV" | base64 -w0)"

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            ${{ secrets.ORACLE_VM_USER }}@${{ secrets.ORACLE_VM_IP }} \
            "DEPLOY_ENV='$DEPLOY_ENV' SECRET_KEY_B64='$SECRET_KEY_B64' POSTGRES_PASSWORD_B64='$POSTGRES_PASSWORD_B64' STEAM_API_KEY_B64='$STEAM_API_KEY_B64' EBAY_CLIENT_ID_B64='$EBAY_CLIENT_ID_B64' EBAY_CLIENT_SECRET_B64='$EBAY_CLIENT_SECRET_B64' EBAY_API_ENV_B64='$EBAY_API_ENV_B64' bash -s" << 'EOF'
            set -euo pipefail

            decode() { printf '%s' "$1" | base64 -d; }

            DEPLOY_ENV="${DEPLOY_ENV:-dev}"
            COMPOSE_FILE="docker-compose.yml"
            if [ "$DEPLOY_ENV" = "prod" ]; then
              COMPOSE_FILE="docker-compose.prod.yml"
            fi

            echo "Deploy environment: $DEPLOY_ENV"
            echo "Using compose file: $COMPOSE_FILE"

            cd ~
            test -f "$COMPOSE_FILE" || { echo "Missing compose file: $COMPOSE_FILE" >&2; exit 1; }

            # 1. Stop current containers
            echo "Stopping current services..."
            if [ -f .env ]; then
                docker compose --env-file .env -f "$COMPOSE_FILE" down || true
            else
                docker compose -f "$COMPOSE_FILE" down || true
            fi

            # 2. Backup current images
            echo "Backing up current images..."
            for img in gamer-nexus-frontend gamer-nexus-backend; do
                if docker image inspect $img:latest >/dev/null 2>&1; then
                    echo "Tagging $img:latest as $img:previous"
                    docker image rm $img:previous 2>/dev/null || true
                    docker tag $img:latest $img:previous
                else
                    echo "No existing image for $img:latest found. Skipping backup."
                fi
            done

            # Create/refresh a local env file for docker compose.
            # Quote values to prevent shell variable expansion
            umask 077
            {
              printf 'SECRET_KEY="%s"\n' "$(decode "$SECRET_KEY_B64")"
              printf 'POSTGRES_PASSWORD="%s"\n' "$(decode "$POSTGRES_PASSWORD_B64")"
              printf 'STEAM_API_KEY="%s"\n' "$(decode "$STEAM_API_KEY_B64")"
              printf 'EBAY_CLIENT_ID="%s"\n' "$(decode "$EBAY_CLIENT_ID_B64")"
              printf 'EBAY_CLIENT_SECRET="%s"\n' "$(decode "$EBAY_CLIENT_SECRET_B64")"
              printf 'EBAY_API_ENV="%s"\n' "$(decode "$EBAY_API_ENV_B64")"
            } > .env

            # Load new images
            echo "Loading new images..."
            docker load < frontend.tar
            docker load < backend.tar
            rm -f frontend.tar backend.tar

            echo "Starting services..."
            docker compose --env-file .env -f "$COMPOSE_FILE" up -d --force-recreate --remove-orphans

            echo "Waiting for services to settle (15s)..."
            sleep 15
            
            chmod +x healthcheck.sh
            echo "Deployment successful. Ready for health checks."
          EOF

      - name: Run Health Checks
        env:
          DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            ${{ secrets.ORACLE_VM_USER }}@${{ secrets.ORACLE_VM_IP }} \
            "DEPLOY_ENV='$DEPLOY_ENV' ./healthcheck.sh"

      - name: Rollback on Failure
        if: failure()
        env:
          DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
        run: |
          echo "Health check or deployment failed. Initiating rollback..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            ${{ secrets.ORACLE_VM_USER }}@${{ secrets.ORACLE_VM_IP }} \
            "DEPLOY_ENV='$DEPLOY_ENV' bash -s" << 'EOF'
            set -euo pipefail
            
            DEPLOY_ENV="${DEPLOY_ENV:-dev}"
            COMPOSE_FILE="docker-compose.yml"
            if [ "$DEPLOY_ENV" = "prod" ]; then
              COMPOSE_FILE="docker-compose.prod.yml"
            fi
            
            cd ~
            
            echo "Stopping broken services..."
            docker compose --env-file .env -f "$COMPOSE_FILE" down || true

            echo "Restoring previous images..."
            for img in gamer-nexus-frontend gamer-nexus-backend; do
                if docker image inspect $img:previous >/dev/null 2>&1; then
                    docker tag $img:previous $img:latest
                    echo "Restored $img:latest from $img:previous"
                else
                    echo "No backup found for $img. Cannot restore."
                fi
            done

            echo "Restarting previous version..."
            docker compose --env-file .env -f "$COMPOSE_FILE" up -d --force-recreate --remove-orphans
            
            echo "Rollback complete."
          EOF

      - name: Cleanup on Success
        if: success()
        env:
          DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
        run: |
          echo "Deployment and health checks passed. Cleaning up..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            ${{ secrets.ORACLE_VM_USER }}@${{ secrets.ORACLE_VM_IP }} \
            "bash -s" << 'EOF'
            echo "Removing previous images..."
            docker image rm gamer-nexus-frontend:previous gamer-nexus-backend:previous 2>/dev/null || true
            docker image prune -f
            echo "Cleanup complete."
          EOF
