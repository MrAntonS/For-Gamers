name: CD

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build frontend image
      run: docker build -t gamer-nexus-frontend:latest ./frontend

    - name: Build backend image
      run: docker build -t gamer-nexus-backend:latest ./backend

    - name: Save Docker images to .tar files
      run: |
        docker save -o frontend.tar gamer-nexus-frontend:latest
        docker save -o backend.tar gamer-nexus-backend:latest

    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.ORACLE_VM_IP }} >> ~/.ssh/known_hosts

    - name: Copy files to VM
      run: scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa docker-compose.prod.yml frontend.tar backend.tar ${{ secrets.ORACLE_VM_USER }}@${{ secrets.ORACLE_VM_IP }}:~/

    - name: Deploy on VM
      run: |
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.ORACLE_VM_USER }}@${{ secrets.ORACLE_VM_IP }} << 'EOF'
          # Rename prod compose file to standard name for convenience
          mv docker-compose.prod.yml docker-compose.yml

          # Stop old containers
          echo "Stopping old containers..."
          docker compose down

          # Remove old images to ensure we use the new ones
          echo "Removing old images..."
          docker rmi gamer-nexus-frontend:latest gamer-nexus-backend:latest || true

          # Load images from .tar files
          echo "Loading frontend image..."
          docker load < frontend.tar
          echo "Loading backend image..."
          docker load < backend.tar
          
          # List loaded images
          echo "Available images:"
          docker images
          
          echo "Starting new containers..."
          docker compose up -d
          
          # Check container status
          echo "Container status:"
          docker compose ps
          
          # Clean up the .tar files and dangling images
          rm frontend.tar backend.tar
          docker image prune -f
        EOF
