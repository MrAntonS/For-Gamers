name: Manual VM Diagnostics

on:
  workflow_dispatch:
    inputs:
      tail_lines:
        description: "How many log lines to show per service"
        required: false
        default: "300"
      include_external_checks:
        description: "Also run outbound connectivity checks (Steam + CheapShark)"
        required: false
        type: boolean
        default: true

jobs:
  diagnostics:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.ORACLE_VM_IP }} >> ~/.ssh/known_hosts

      - name: Run diagnostics on VM
        env:
          TAIL_LINES: ${{ inputs.tail_lines }}
          INCLUDE_EXTERNAL_CHECKS: ${{ inputs.include_external_checks }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.ORACLE_VM_USER }}@${{ secrets.ORACLE_VM_IP }} << EOF
            # Avoid set -e so we still print partial diagnostics on failures.
            set +e

            TAIL_LINES="${TAIL_LINES:-300}"
            INCLUDE_EXTERNAL_CHECKS="${INCLUDE_EXTERNAL_CHECKS:-true}"

            # Ensure docker compose doesn't warn about unset variables when parsing docker-compose.yml.
            # We intentionally DO NOT pass GitHub secrets into this script (they can contain newlines and
            # break heredocs, and diagnostics shouldn't need secret values).
            export POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-__set__}"
            export SECRET_KEY="${SECRET_KEY:-__set__}"
            export STEAM_API_KEY="${STEAM_API_KEY:-__set__}"
            export EBAY_API_KEY="${EBAY_API_KEY:-__set__}"

            # Try to run from a directory that has docker-compose.yml (CD places it in ~).
            if [ -f "$HOME/docker-compose.yml" ]; then
              cd "$HOME"
            else
              FOUND_COMPOSE="$(find "$HOME" -maxdepth 3 -name docker-compose.yml -print -quit 2>/dev/null)"
              if [ -n "$FOUND_COMPOSE" ]; then
                cd "$(dirname "$FOUND_COMPOSE")"
              fi
            fi

            echo "=== Working Directory ==="
            pwd || true
            ls -la || true

            echo "=== Host Info ==="
            uname -a || true
            date || true
            uptime || true
            df -h || true
            free -m || true

            echo "=== Docker Info ==="
            docker version || true
            docker compose version || true

            echo "=== Compose Status ==="
            docker compose ps -a || true

            echo "=== Recent Images (gamer-nexus) ==="
            docker images | grep -E 'gamer-nexus|REPOSITORY' || true

            echo "=== Backend Logs (tail: ${TAIL_LINES}) ==="
            docker compose logs backend --tail "${TAIL_LINES}" || true

            echo "=== Backend Logs (docker logs fallback) ==="
            docker ps -a --filter label=com.docker.compose.service=backend --format 'table {{.ID}}\t{{.Names}}\t{{.Status}}' || true
            for CID in $(docker ps -aq --filter label=com.docker.compose.service=backend 2>/dev/null); do
              echo "--- docker logs for $CID ---"
              docker logs --tail "${TAIL_LINES}" "$CID" 2>&1 || true
            done

            echo "=== DB Logs (tail: ${TAIL_LINES}) ==="
            docker compose logs db --tail "${TAIL_LINES}" || true

            echo "=== DB Logs (docker logs fallback) ==="
            docker ps -a --filter label=com.docker.compose.service=db --format 'table {{.ID}}\t{{.Names}}\t{{.Status}}' || true
            for CID in $(docker ps -aq --filter label=com.docker.compose.service=db 2>/dev/null); do
              echo "--- docker logs for $CID ---"
              docker logs --tail "${TAIL_LINES}" "$CID" 2>&1 || true
            done

            echo "=== Frontend Logs (tail: ${TAIL_LINES}) ==="
            docker compose logs frontend --tail "${TAIL_LINES}" || true

            echo "=== Frontend Logs (docker logs fallback) ==="
            docker ps -a --filter label=com.docker.compose.service=frontend --format 'table {{.ID}}\t{{.Names}}\t{{.Status}}' || true
            for CID in $(docker ps -aq --filter label=com.docker.compose.service=frontend 2>/dev/null); do
              echo "--- docker logs for $CID ---"
              docker logs --tail "${TAIL_LINES}" "$CID" 2>&1 || true
            done

            echo "=== Backend Container Environment Presence (no secret values) ==="
            docker compose exec -T backend python -c "import os; keys=['DATABASE_URL','STEAM_API_KEY','EBAY_API_KEY','SECRET_KEY']; [print(f'{k} set: {bool(os.getenv(k))}') for k in keys]" || true

            if [ "${INCLUDE_EXTERNAL_CHECKS}" = "true" ]; then
              echo "=== External Connectivity Checks ==="
              if command -v curl >/dev/null 2>&1; then
                echo "Steam store (HEAD):"
                curl -I -fsS --max-time 10 https://store.steampowered.com/ | head -n 5 || true

                echo "Steam Web API (sample call):"
                curl -fsS --max-time 10 "https://api.steampowered.com/ISteamNews/GetNewsForApp/v2/?appid=440&count=1&maxlength=1" | head -c 300 || true
                echo

                echo "CheapShark API (sample deals):"
                curl -fsS --max-time 10 "https://www.cheapshark.com/api/1.0/deals?pageSize=1" | head -c 300 || true
                echo
              else
                echo "curl not installed on VM; skipping external checks"
              fi
            else
              echo "External checks disabled."
            fi

            echo "=== Done ==="
          EOF
