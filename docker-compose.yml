services:
  frontend:
    image: gamer-nexus-frontend:latest
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    image: gamer-nexus-backend:latest
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/gamernexus
      - STEAM_API_KEY=${STEAM_API_KEY}
      - EBAY_API_KEY=${EBAY_API_KEY}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=gamernexus
    ports:
      - "5432:5432"

volumes:
  postgres_data:
