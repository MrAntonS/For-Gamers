services:
  frontend:
    image: gamer-nexus-frontend:latest
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    image: gamer-nexus-backend:latest
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/logs:/app/logs
    environment:
      - FLASK_ENV=development
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - POSTGRES_DB=gamernexus
      - STEAM_API_KEY=${STEAM_API_KEY}
      - EBAY_CLIENT_ID=${EBAY_CLIENT_ID}
      - EBAY_CLIENT_SECRET=${EBAY_CLIENT_SECRET}
      - EBAY_API_ENV=${EBAY_API_ENV}
      - LOG_DIR=/app/logs
      - LOG_FILE=/app/logs/app.log
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=gamernexus
    ports:
      - "5432:5432"

volumes:
  postgres_data:
