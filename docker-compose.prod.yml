services:
  frontend:
    image: gamer-nexus-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    image: gamer-nexus-backend:latest
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/gamernexus
      - STEAM_API_KEY=${STEAM_API_KEY}
      - EBAY_API_KEY=${EBAY_API_KEY}
      - LOG_DIR=/app/logs
      - LOG_FILE=/app/logs/app.log
      - REDIRECT_STDOUT_TO_LOG=1
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=gamernexus
    restart: always

volumes:
  postgres_data:
