services:
  frontend:
    image: gamer-nexus-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    image: gamer-nexus-backend:latest
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_DB=gamernexus-prod
      - STEAM_API_KEY=${STEAM_API_KEY}
      - EBAY_CLIENT_ID=${EBAY_CLIENT_ID}
      - EBAY_CLIENT_SECRET=${EBAY_CLIENT_SECRET}
      - EBAY_API_ENV=${EBAY_API_ENV}
      - LOG_DIR=/app/logs
      - LOG_FILE=/app/logs/app.log
      - REDIRECT_STDOUT_TO_LOG=1
    depends_on:
      - db

  # Background worker for Steam and eBay updates
  worker:
    image: gamer-nexus-backend:latest
    command: ["python", "background_worker.py"]
    volumes:
      - ./logs:/app/logs
    environment:
      - FLASK_ENV=production
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_DB=gamernexus-prod
      - STEAM_API_KEY=${STEAM_API_KEY}
      - EBAY_CLIENT_ID=${EBAY_CLIENT_ID}
      - EBAY_CLIENT_SECRET=${EBAY_CLIENT_SECRET}
      - EBAY_API_ENV=${EBAY_API_ENV}
      - LOG_DIR=/app/logs
      - LOG_FILE=/app/logs/worker.log
      - REDIRECT_STDOUT_TO_LOG=0
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=gamernexus-prod
    restart: always

volumes:
  postgres_data:
